name: Tests and security regressions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents hla_matcher.py enrichment.py cli.py simulator.py
      - name: Run unit and regression tests
        run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check browser module syntax
        run: node --check docs/matcher.mjs
      - name: Test browser algorithms and CSV exports
        run: node --test tests/browser.test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t hla-compatibility-matcher:smoke .
      - name: Smoke test static app and authenticated API
        run: |
          docker run -d --name hla-smoke -p 127.0.0.1:8000:8000 -e API_ACCESS_TOKEN=ci-smoke-token hla-compatibility-matcher:smoke
          trap 'docker logs hla-smoke; docker rm -f hla-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'HLA Compatibility Matcher'
          curl -fsS -X POST http://127.0.0.1:8000/api/audit \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-smoke-token' \
            -d '{"task_id":"SMOKE","target_identifier":"SAMPLE","primary_metric":1.0}' | grep -q 'dossier_id'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/audit/logs)" = "401"
